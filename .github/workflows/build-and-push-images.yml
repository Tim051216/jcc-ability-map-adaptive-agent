name: Build And Push Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-images:
    name: Build ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: a3-auth-service
            maven_module: a3-auth/a3-auth-service
            jar_path: a3-auth/a3-auth-service/target/a3-auth-service.jar
            context_dir: .github/.ci-image-contexts/a3-auth-service
            dockerfile: .github/.ci-image-contexts/a3-auth-service/Dockerfile
            kind: java
          - image_name: a3-learning-service
            maven_module: a3-learning
            jar_path: a3-learning/target/a3-learning.jar
            context_dir: .github/.ci-image-contexts/a3-learning-service
            dockerfile: .github/.ci-image-contexts/a3-learning-service/Dockerfile
            kind: java
          - image_name: a3-gateway
            maven_module: a3-gateway
            jar_path: a3-gateway/target/a3-gateway.jar
            context_dir: .github/.ci-image-contexts/a3-gateway
            dockerfile: .github/.ci-image-contexts/a3-gateway/Dockerfile
            kind: java
          - image_name: a3-ai-python
            context_dir: a3-ai-python
            dockerfile: a3-ai-python/Dockerfile
            kind: direct
          - image_name: a3-student-web
            context_dir: a3-student-react-web
            dockerfile: a3-student-react-web/Dockerfile
            kind: direct
            build_args: VITE_AI_BASE_URL=${{ vars.VITE_AI_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        if: matrix.kind == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build java service
        if: matrix.kind == 'java'
        run: |
          chmod +x mvnw
          ./mvnw -B -pl "${{ matrix.maven_module }}" -am -DskipTests package

      - name: Prepare java image context
        if: matrix.kind == 'java'
        shell: bash
        run: |
          mkdir -p "${{ matrix.context_dir }}"
          cp Dockerfile "${{ matrix.context_dir }}/Dockerfile"
          JAR_FILE="${{ matrix.jar_path }}"
          if [ ! -f "$JAR_FILE" ]; then
            echo "No jar produced at $JAR_FILE"
            exit 1
          fi
          cp "$JAR_FILE" "${{ matrix.context_dir }}/app.jar"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context_dir }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

  render-k8s-summary:
    name: Render K8s Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Render base kustomization
        run: kubectl kustomize k8s > /tmp/k8s-base.yaml

      - name: Render prod overlay
        run: kubectl kustomize k8s/overlays/prod > /tmp/k8s-prod.yaml

      - name: Report rendered manifest sizes
        run: wc -l /tmp/k8s-base.yaml /tmp/k8s-prod.yaml
