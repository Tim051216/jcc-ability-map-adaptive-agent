server:
  port: 8085  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: message-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
a3:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.cnsoftbei.a3.message.controller
    title: A3个性化学习智能体系统 - 消息服务接口文档
    description: 提供通知消息、站内信与消息处理相关接口。
    contact-name: A3参赛团队
    contact-url: https://www.cnsoftbei.com/content-3-1286-1.html
    contact-email: 1752401825@qq.com
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
  jdbc:
    database: tj_message
  sms:
    ali:
      accessId: LTAI5tHyKqhaN6k3u2jVeiX6
      accessSecret: aEQn9qWGLzZPFHcnfHALS474VeiTSY
