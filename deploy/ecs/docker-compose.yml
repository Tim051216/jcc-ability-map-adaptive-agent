services:
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  a3-learning-service:
    build:
      context: ../..
      dockerfile: a3-learning/Dockerfile
    env_file:
      - ./env/learning.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EVALUATION_AI_BASE_URL: http://a3-ai-python:18080
    depends_on:
      - redis
    restart: unless-stopped

  a3-user-service:
    build:
      context: ../..
      dockerfile: a3-user/Dockerfile
    env_file:
      - ./env/user.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - redis
    restart: unless-stopped

  a3-course-service:
    build:
      context: ../..
      dockerfile: a3-resource/Dockerfile
    env_file:
      - ./env/course.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - redis
    restart: unless-stopped

  a3-exam-service:
    build:
      context: ../..
      dockerfile: a3-assessment/Dockerfile
    env_file:
      - ./env/exam.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - redis
    restart: unless-stopped

  a3-ai-python:
    build:
      context: ../../a3-ai-python
      dockerfile: Dockerfile
    env_file:
      - ./env/ai.env
    depends_on:
      - redis
    restart: unless-stopped

  a3-gateway:
    build:
      context: ../..
      dockerfile: a3-gateway/Dockerfile
    env_file:
      - ./env/gateway.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_SERVICE_BASE_URL: http://a3-ai-python:18080
      LEARNING_SERVICE_BASE_URL: http://a3-learning-service:8090
    depends_on:
      - redis
      - a3-learning-service
      - a3-ai-python
      - a3-user-service
      - a3-course-service
      - a3-exam-service
    restart: unless-stopped

  a3-student-web:
    build:
      context: ../../a3-student-react-web
      dockerfile: Dockerfile
      args:
        VITE_AI_BASE_URL: /ai/api/v1
    restart: unless-stopped

  a3-nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    depends_on:
      - a3-gateway
      - a3-student-web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  redis-data:
