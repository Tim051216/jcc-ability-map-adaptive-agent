services:
  a3-learning-service:
    build:
      context: ../..
      dockerfile: a3-learning/Dockerfile
    env_file:
      - ./env/learning.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EVALUATION_AI_BASE_URL: http://a3-ai-python:18080
    restart: unless-stopped

  a3-ai-python:
    build:
      context: ../../a3-ai-python
      dockerfile: Dockerfile
    env_file:
      - ./env/ai.env
    restart: unless-stopped

  a3-gateway:
    build:
      context: ../..
      dockerfile: a3-gateway/Dockerfile
    env_file:
      - ./env/gateway.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_SERVICE_BASE_URL: http://a3-ai-python:18080
      LEARNING_SERVICE_BASE_URL: http://a3-learning-service:8090
    depends_on:
      - a3-learning-service
      - a3-ai-python
    restart: unless-stopped

  a3-student-web:
    build:
      context: ../../a3-student-react-web
      dockerfile: Dockerfile
      args:
        VITE_AI_BASE_URL: /ai/api/v1
    restart: unless-stopped

  a3-nginx:
    image: nginx:1.27-alpine
    depends_on:
      - a3-gateway
      - a3-student-web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
