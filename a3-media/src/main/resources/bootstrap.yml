server:
  port: 8084  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
a3:
  swagger:
    enable: true
    package-path: com.cnsoftbei.a3.media.controller
    title: A3个性化学习智能体系统 - 媒资服务接口文档
    description: 提供媒资上传、管理与访问相关接口。
    contact-name: A3参赛团队
    contact-url: https://www.cnsoftbei.com/content-3-1286-1.html
    contact-email: 1752401825@qq.com
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: tj_media
  platform:
    file: TENCENT
    media: TENCENT
  tencent:
    appId: ${TENCENT_VOD_APP_ID:replace-me}
    secretId: ${TENCENT_VOD_SECRET_ID:replace-me}
    secretKey: ${TENCENT_VOD_SECRET_KEY:replace-me}
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: "ap-shanghai"
      procedure: "wisehub-base"
      urlKey: ${TENCENT_VOD_URL_KEY:replace-me}
      pfcg: ${TENCENT_VOD_DRM_PRESET:basicDrmPreset}
    cos:
      enable: true
      region: "ap-shanghai"
      bucket: ${TENCENT_COS_BUCKET:replace-me}
      multipartUploadThreshold: 5242880 # 5mb，触发分片上传的阈值
      minimumUploadPartSize: 1048576 # 1mb，分片的最小大小
