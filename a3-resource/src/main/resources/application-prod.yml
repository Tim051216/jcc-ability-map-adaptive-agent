spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tj_course}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    timeout: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    dynamic: false
    listener:
      simple:
        auto-startup: false
        missing-queues-fatal: false
      direct:
        auto-startup: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

seata:
  enabled: false

a3:
  auth:
    resource:
      enable: false
  redisson:
    enabled: false
  xxl-job:
    enabled: false

logging:
  level:
    springfox.documentation.swagger.readers.operation.OperationImplicitParameterReader: error
