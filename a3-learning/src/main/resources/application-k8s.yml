a3:
  evaluation-ai:
    base-url: http://a3-ai-python:18080
    profile-forward-enabled: true
  redisson:
    enabled: false
  mq:
    listeners:
      enabled: false
  xxl-job:
    enabled: false

spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            user-service:
              - uri: http://a3-user-service:8082
            course-service:
              - uri: http://a3-course-service:8086
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://a3-mysql:3306/tj_learning?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:a3mysql123}
  redis:
    host: a3-redis
    port: 6379
    database: 0
    timeout: 10s
  rabbitmq:
    host: a3-rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    dynamic: false
    listener:
      simple:
        auto-startup: false
        missing-queues-fatal: false
      direct:
        auto-startup: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    field-strategy: 0
    db-config:
      logic-delete-field: deleted
      id-type: assign_id
