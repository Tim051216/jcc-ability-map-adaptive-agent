openapi: 3.0.3
info:
  title: XA-202603 岗课赛岗位能力插件
  version: 1.1.0
  description: 面向赛题的岗位动态分析、岗位能力图谱、典型任务转学习卡、个性化岗课赛路径，以及软件技术专业群学习概览。
servers:
  - url: https://scenic-but-acquisition-criterion.trycloudflare.com
    description: 2026-09-13 当前调试使用的临时 HTTPS 隧道；正式部署前应替换为稳定域名
paths:
  /api/v1/xa-competition/industry/jobs-analysis:
    get:
      operationId: getIndustryJobsAnalysis
      summary: 采集并分析公开岗位需求
      description: 并发读取部署方配置的公开 JSON、CSV 或 HTML 岗位源，返回 fetched_count（成功读取记录数）、按专业群相关性筛选的 sample_count、技能热度、专业匹配、预警和培养方案优化建议；不读取个人简历信息。服务端对同一来源设置 5 分钟缓存，避免高频重复请求。
      parameters:
        - {name: refresh, in: query, schema: {type: boolean, default: false}}
        - {name: professional_group, in: query, schema: {type: string, default: 软件技术专业群}}
        - {name: core_job, in: query, schema: {type: string}}
        - {name: source_urls, in: query, schema: {type: string}}
      responses:
        "200": {description: 岗位动态分析结果}
  /api/v1/xa-competition/industry/professional-groups:
    get:
      operationId: getProfessionalGroupsMonitor
      summary: 横向监测专业群发展
      parameters:
        - {name: refresh, in: query, schema: {type: boolean, default: false}}
        - {name: source_urls, in: query, schema: {type: string}}
      responses:
        "200": {description: 六个专业群的样本、匹配度和预警}
  /api/v1/xa-competition/job-ability/generate:
    post:
      operationId: generateJobAbilityGraph
      summary: 生成岗位能力图谱
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [job_name], properties: {job_name: {type: string}, professional_group: {type: string}, observed_skills: {type: array, items: {type: string}}, typical_tasks: {type: array, items: {type: string}}}}}}
      responses:
        "200": {description: 产业链、岗位群、能力项、能力单元、技能点和知识点}
  /api/v1/xa-competition/learning-task/generate:
    post:
      operationId: generateLearningTaskCard
      summary: 将岗位典型任务转为学习任务卡
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [work_task], properties: {work_task: {type: string}, job_name: {type: string}, professional_group: {type: string}, industry_context: {type: string}, ability_focus: {type: array, items: {type: string}}}}}}
      responses:
        "200": {description: 情境、步骤、安全要点、知识技能点和实训资源}
  /api/v1/xa-competition/adaptive-learning/recommend:
    post:
      operationId: recommendAdaptiveLearning
      summary: 生成个性化岗课赛学习路径
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [goal], properties: {goal: {type: string}, goal_scene: {type: string}, job_name: {type: string}, assessment_scores: {type: object}, ability_labels: {type: object}, completed_skills: {type: array, items: {type: string}}}}}}
      responses:
        "200": {description: 薄弱项、课岗赛顺序、进度和徽章}
  /api/v1/student-portal/job-learning:
    get:
      operationId: getJobLearningOverview
      summary: 获取岗位能力学习概览
      description: 返回软件开发工程师岗位五维能力数据。没有测评时分数为 null，不会生成固定雷达图分数。
      parameters:
        - name: user_id
          in: query
          required: false
          description: 学生用户 ID，比赛演示账号使用 1001。
          schema:
            type: integer
            default: 1001
        - name: course_id
          in: query
          required: false
          description: 课程 ID，软件工程演示课程使用 401。
          schema:
            type: integer
            default: 401
      responses:
        "200":
          description: 岗位能力学习概览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLearningOverview"
        "422":
          description: 参数校验失败
components:
  schemas:
    JobAbilityDimension:
      type: object
      required: [code, label, benchmark, assessment_status, evidence]
      properties:
        code:
          type: string
          enum:
            - requirement_analysis
            - system_design
            - coding_implementation
            - software_testing
            - project_collaboration
        label:
          type: string
        score:
          type: number
          nullable: true
        benchmark:
          type: number
        assessment_status:
          type: string
          enum: [measured, derived, not_assessed]
        evidence:
          type: array
          items:
            type: string
    JobLearningOverview:
      type: object
      required:
        - user_id
        - course_id
        - professional_group
        - job_name
        - student_goal
        - goal_scene
        - ability_dimensions
        - weak_abilities
        - recommended_path
        - recommended_resources
        - citations
        - safety_notices
        - ai_generated
        - next_action
      properties:
        user_id:
          type: integer
        course_id:
          type: integer
        course_code:
          type: string
        course_name:
          type: string
        professional_group:
          type: string
          example: 软件技术专业群
        job_name:
          type: string
          example: 软件开发工程师
        student_goal:
          type: string
        goal_scene:
          type: string
          enum: [course, training, competition, internship]
        assessment_id:
          type: string
          nullable: true
        assessment_updated_at:
          type: string
          nullable: true
        ability_dimensions:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/JobAbilityDimension"
        weak_abilities:
          type: array
          items:
            type: object
            additionalProperties: true
        recommended_path:
          type: array
          items:
            type: object
            additionalProperties: true
        recommended_resources:
          type: array
          items:
            type: object
            additionalProperties: true
        citations:
          type: array
          items:
            type: object
            additionalProperties: true
        safety_notices:
          type: array
          items:
            type: object
            additionalProperties: true
        ai_generated:
          type: boolean
        next_action:
          type: object
          additionalProperties: true
