apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a3-mysql-pvc
  namespace: a3
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-mysql
  namespace: a3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a3-mysql
  template:
    metadata:
      labels:
        app: a3-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.36
          args:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: a3-app-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: a3-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: a3-mysql
  namespace: a3
spec:
  selector:
    app: a3-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
