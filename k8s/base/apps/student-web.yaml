apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-student-web
  namespace: a3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a3-student-web
  template:
    metadata:
      labels:
        app: a3-student-web
    spec:
      containers:
        - name: student-web
          image: ghcr.io/your-org/a3-student-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: a3-student-web
  namespace: a3
spec:
  selector:
    app: a3-student-web
  ports:
    - name: http
      port: 80
      targetPort: 80
