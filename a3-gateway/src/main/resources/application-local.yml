spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: http://127.0.0.1:8081
  redis:
    host: 127.0.0.1
    port: 16379
    database: 0
    timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

a3:
  auth:
    jwk-fetch-enabled: false
    # Keep local AI route debugging independent from auth-service/JWKS startup.
    exclude-path:
      - GET:/ai/**
      - POST:/ai/**
      - PUT:/ai/**
      - DELETE:/ai/**
      - OPTIONS:/ai/**
