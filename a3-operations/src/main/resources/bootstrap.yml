server:
  port: 8092  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: promotion-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
          - data-id: shared-xxljob.yaml # 共享xxlJob配置
            refresh: false
a3:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.cnsoftbei.a3.learning.controller
    title: A3个性化学习智能体系统 - 运营服务接口文档
    description: 提供活动、运营配置与业务管理相关接口。
    contact-name: A3参赛团队
    contact-url: https://www.cnsoftbei.com/content-3-1286-1.html
    contact-email: 1752401825@qq.com
    version: v1.0
  jdbc:
    database: tj_promotion
  auth:
    resource:
      enable: true

  mq:
    listener:
      retry:
        stateless: false # 如果mq的消费者启用了事务，那么需要设置mq的消费者为无状态（可以简化事务处理的复杂性，更容易地实现并发处理、水平扩展和容错性）
