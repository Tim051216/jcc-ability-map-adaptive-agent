apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-rabbitmq
  namespace: a3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a3-rabbitmq
  template:
    metadata:
      labels:
        app: a3-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: a3-app-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: a3-app-secrets
                  key: RABBITMQ_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: a3-rabbitmq
  namespace: a3
spec:
  selector:
    app: a3-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
