apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-redis
  namespace: a3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a3-redis
  template:
    metadata:
      labels:
        app: a3-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: a3-redis
  namespace: a3
spec:
  selector:
    app: a3-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
