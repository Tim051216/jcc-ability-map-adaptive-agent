apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-auth-service
  namespace: a3
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: auth
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-learning-service
  namespace: a3
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: learning
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
---
