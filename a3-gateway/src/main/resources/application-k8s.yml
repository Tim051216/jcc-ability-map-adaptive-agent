spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: http://a3-auth-service:8081
  redis:
    host: a3-redis
    port: 6379
    database: 0
    timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

a3:
  auth:
    jwk-fetch-enabled: false
    exclude-path:
      - GET:/ai/**
      - POST:/ai/**
      - PUT:/ai/**
      - DELETE:/ai/**
      - OPTIONS:/ai/**
