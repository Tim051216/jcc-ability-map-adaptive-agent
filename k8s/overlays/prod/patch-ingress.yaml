apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a3-ingress
  namespace: a3
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
spec:
  rules:
    - host: a3.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: a3-student-web
                port:
                  number: 80
          - path: /as
            pathType: Prefix
            backend:
              service:
                name: a3-gateway
                port:
                  number: 10010
          - path: /ls
            pathType: Prefix
            backend:
              service:
                name: a3-gateway
                port:
                  number: 10010
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: a3-gateway
                port:
                  number: 10010
