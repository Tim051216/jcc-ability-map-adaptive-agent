apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a3-postgres-pvc
  namespace: a3
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-postgres
  namespace: a3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a3-postgres
  template:
    metadata:
      labels:
        app: a3-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: a3_ai
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: a3-app-secrets
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: a3-app-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: a3-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: a3-postgres
  namespace: a3
spec:
  selector:
    app: a3-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
