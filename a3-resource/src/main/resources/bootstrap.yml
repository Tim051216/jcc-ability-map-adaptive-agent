server:
  port: 8086  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: course-service
  main:
    allow-circular-references: true
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
          - data-id: shared-redis.yaml # 共享redis配置
          - data-id: shared-mybatis.yaml # 共享mybatis配置
          - data-id: shared-logs.yaml # 共享日志配置
          - data-id: shared-feign.yaml # 共享feign配置
          - data-id: shared-mq.yaml # 共享MQ配置
          - data-id: shared-seata.yaml # 共享seata配置
          - data-id: shared-xxljob.yaml # 共享seata配置
a3:
  swagger:
    enable: true
    package-path: com.cnsoftbei.a3.course.controller
    title: A3个性化学习智能体系统 - 课程资源服务接口文档
    description: 提供课程、目录、资源与内容管理相关接口。
    contact-name: A3参赛团队
    contact-url: https://www.cnsoftbei.com/content-3-1286-1.html
    contact-email: 1752401825@qq.com
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: false
  jdbc:
    database: tj_course
