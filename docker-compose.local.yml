services:
  mysql:
    image: mysql:8.0.36
    container_name: a3-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: a3mysql123
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    container_name: a3-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "16379:6379"
    volumes:
      - ./docker/redis/data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: a3-rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker/rabbitmq:/var/lib/rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: a3-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: a3_ai
      POSTGRES_USER: a3_ai
      POSTGRES_PASSWORD: a3_ai_123
    ports:
      - "15432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: a3-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./docker/minio/data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: a3-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      /usr/local/bin/etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    ports:
      - "12379:2379"
    volumes:
      - ./docker/milvus/etcd:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.11
    container_name: a3-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "19091:9091"
    volumes:
      - ./docker/milvus/standalone:/var/lib/milvus
    depends_on:
      - etcd
      - minio
