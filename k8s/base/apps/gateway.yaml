apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-gateway
  namespace: a3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a3-gateway
  template:
    metadata:
      labels:
        app: a3-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/a3-gateway:latest
          ports:
            - containerPort: 10010
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
          readinessProbe:
            tcpSocket:
              port: 10010
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10010
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: a3-gateway
  namespace: a3
spec:
  selector:
    app: a3-gateway
  ports:
    - name: http
      port: 10010
      targetPort: 10010
